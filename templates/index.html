<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nexus Core | AI Assistant</title>
    
    <!-- iOS Native Interface Configurations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NexusCore">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
      :root {
        --bg-obsidian: #090a0f;
        --bg-card: #131620;
        --bg-surface: #1a1e2e;
        --border-subtle: #262d45;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --accent-emerald: #10b981;
        --accent-hover: #059669;
        --bubble-ai: #1e2436;
        --bubble-user: #059669;
        --font-family: "Inter", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        height: 100dvh;
        background-color: var(--bg-obsidian);
        color: var(--text-main);
        font-family: var(--font-family);
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Main Application Shell */
      .nexus-container {
        width: 100%;
        max-width: 880px;
        height: 100%;
        max-height: 900px;
        background-color: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      /* Header Bar */
      .nexus-header {
        background-color: rgba(19, 22, 32, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-subtle);
        padding: 1.125rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .brand-title {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .brand-icon {
        height: 34px;
        width: 34px;
        background: linear-gradient(135deg, #10b981, #047857);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.9rem;
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
      }

      .system-status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--accent-emerald);
        background-color: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
      }

      .status-dot {
        height: 6px;
        width: 6px;
        background-color: var(--accent-emerald);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-emerald);
      }

      /* Chat Message History Area */
      .chat-viewport {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      .chat-viewport::-webkit-scrollbar {
        width: 5px;
      }
      .chat-viewport::-webkit-scrollbar-thumb {
        background-color: var(--border-subtle);
        border-radius: 10px;
      }

      /* Message Bubbles */
      .msg-row {
        display: flex;
        align-items: flex-start;
        gap: 0.875rem;
        max-width: 85%;
        animation: fadeInUp 0.25s ease-out;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .msg-row.system {
        align-self: flex-start;
      }

      .msg-row.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .msg-avatar {
        height: 32px;
        width: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 0.85rem;
      }

      .msg-row.system .msg-avatar {
        background-color: var(--bg-surface);
        color: var(--accent-emerald);
        border: 1px solid var(--border-subtle);
      }

      .msg-row.user .msg-avatar {
        background-color: var(--accent-emerald);
        color: white;
      }

      .msg-bubble {
        padding: 0.875rem 1.125rem;
        border-radius: 14px;
        font-size: 0.925rem;
        line-height: 1.55;
        word-wrap: break-word;
        flex: 1;
      }

      .msg-row.system .msg-bubble {
        background-color: var(--bubble-ai);
        color: var(--text-main);
        border-top-left-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.02);
      }

      .msg-row.user .msg-bubble {
        background-color: var(--bubble-user);
        color: #ffffff;
        border-top-right-radius: 4px;
      }

      /* Markdown inner styling rules */
      .msg-bubble p { margin-bottom: 0.4rem; }
      .msg-bubble p:last-child { margin-bottom: 0; }
      .msg-bubble code { background: rgba(0,0,0,0.3); padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.85rem; }
      .msg-bubble pre { background: rgba(0,0,0,0.4); padding: 0.75rem; border-radius: 8px; overflow-x: auto; margin-top: 0.5rem; }
      .msg-bubble ul, .msg-bubble ol { padding-left: 1.25rem; margin-bottom: 0.4rem; }

      /* Typing Indicator */
      .typing-status {
        padding: 0.25rem 0;
        font-size: 0.813rem;
        color: var(--text-muted);
        font-style: italic;
        display: none;
        margin-left: 2.75rem;
      }

      .typing-status span::after {
        content: '...';
        animation: typingDots 1.4s infinite steps(4);
      }

      @keyframes typingDots {
        0%, 20% { content: ''; }
        40% { content: '.'; }
        60% { content: '..'; }
        80%, 100% { content: '...'; }
      }

      /* Input Control Bar */
      .nexus-input-panel {
        background-color: rgba(19, 22, 32, 0.9);
        backdrop-filter: blur(10px);
        border-top: 1px solid var(--border-subtle);
        padding: 1rem 1.5rem;
        flex-shrink: 0;
      }

      .input-wrapper {
        display: flex;
        align-items: flex-end;
        gap: 0.75rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        padding: 0.625rem 0.875rem;
        transition: all 0.2s ease;
      }

      .input-wrapper:focus-within {
        border-color: var(--accent-emerald);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }

      .input-wrapper textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-main);
        font-family: var(--font-family);
        font-size: 0.925rem;
        resize: none;
        outline: none;
        max-height: 110px;
        line-height: 1.5;
        padding: 0;
      }

      .input-wrapper textarea::placeholder {
        color: var(--text-muted);
      }

      .action-send-btn {
        background-color: var(--accent-emerald);
        color: white;
        border: none;
        border-radius: 9px;
        height: 36px;
        width: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.2s;
        flex-shrink: 0;
      }

      .action-send-btn:hover:not(:disabled) {
        background-color: var(--accent-hover);
      }

      .action-send-btn:disabled {
        background-color: var(--border-subtle);
        color: var(--text-muted);
        cursor: not-allowed;
      }

      .input-hint-text {
        font-size: 0.725rem;
        color: var(--text-muted);
        margin-top: 0.5rem;
        padding-left: 0.25rem;
      }

      /* Mobile Adaptive Breakpoint */
      @media (max-width: 900px) {
        body {
          padding: 0;
        }

        .nexus-container {
          height: 100dvh;
          max-height: 100dvh;
          border-radius: 0;
          border: none;
        }

        .msg-row {
          max-width: 92%;
        }

        .nexus-header {
          padding: 0.875rem 1rem;
        }

        .chat-viewport {
          padding: 1rem;
        }

        .nexus-input-panel {
          padding: 0.75rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="nexus-container">
      <!-- Header -->
      <header class="nexus-header">
        <div class="brand-title">
          <div class="brand-icon">
            <i class="fas fa-network-wired"></i>
          </span>
          <span>Nexus Core</span>
        </div>
        <div class="system-status">
          <span class="status-dot"></span>
          Connected
        </div>
      </header>

      <!-- Chat Viewport -->
      <div class="chat-viewport" id="chatViewport">
        <div class="msg-row system">
          <div class="msg-avatar">
            <i class="fas fa-terminal"></i>
          </div>
          <div class="msg-bubble">
            <p>Nexus diagnostics initialized. Neural network operational. Query parameters await input.</p>
          </div>
        </div>
      </div>

      <!-- Typing Status -->
      <div class="typing-status" id="typingStatus">
        <span>Processing request</span>
      </div>

      <!-- Input Panel -->
      <div class="nexus-input-panel">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            placeholder="Type your command or prompt..."
            rows="1"
          ></textarea>
          <button
            id="sendBtn"
            class="action-send-btn"
            onclick="sendMessage()"
            disabled
            title="Execute"
          >
            <i class="fas fa-arrow-up"></i>
          </button>
        </div>
        <div class="input-hint-text">
          <i class="fas fa-keyboard me-1"></i> Enter to transmit, Shift+Enter for newline
        </div>
      </div>
    </div>

    <script>
      const chatViewport = document.getElementById('chatViewport');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const typingStatus = document.getElementById('typingStatus');
      let isSending = false;

      // Auto-resize textarea box
      function autoResize() {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
      }

      // Update button interactive state
      function updateButtonState() {
        const text = userInput.value.trim();
        sendBtn.disabled = !(text.length > 0 && !isSending);
      }

      userInput.addEventListener('input', () => {
        autoResize();
        updateButtonState();
      });

      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!sendBtn.disabled) sendMessage();
        }
      });

      // API Communication Logic
      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text || isSending) return;

        isSending = true;
        updateButtonState();
        userInput.disabled = true;

        appendMessage(text, 'user');
        userInput.value = '';
        autoResize();

        typingStatus.style.display = 'block';
        scrollToBottom();

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text }),
          });

          const data = await response.json();
          typingStatus.style.display = 'none';

          if (data.response && data.response.includes('<')) {
            appendHTMLMessage(data.response, 'system');
          } else {
            appendMessage(data.response || 'No response returned.', 'system');
          }
        } catch (error) {
          typingStatus.style.display = 'none';
          appendMessage('Error: Failed to reach backend node.', 'system');
        } finally {
          isSending = false;
          userInput.disabled = false;
          userInput.focus();
          updateButtonState();
        }
      }

      function appendMessage(text, sender) {
        const row = document.createElement('div');
        row.className = `msg-row ${sender}`;

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.innerHTML = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-terminal"></i>';

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = text;

        row.appendChild(avatar);
        row.appendChild(bubble);
        chatViewport.appendChild(row);
        scrollToBottom();
      }

      function appendHTMLMessage(htmlContent, sender) {
        const row = document.createElement('div');
        row.className = `msg-row ${sender}`;

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.innerHTML = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-terminal"></i>';

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.innerHTML = htmlContent;

        row.appendChild(avatar);
        row.appendChild(bubble);
        chatViewport.appendChild(row);
        scrollToBottom();
      }

      function scrollToBottom() {
        chatViewport.scrollTop = chatViewport.scrollHeight;
      }

      updateButtonState();
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
